databases:
  - name: contractlens-db
    databaseName: contractlens
    user: contractlens
    plan: basic-1gb
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: contractlens-api
    runtime: python
    plan: 1c-2g
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m scripts.init_db
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: ContractLens API
      - key: DATABASE_URL
        fromDatabase:
          name: contractlens-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIMENSIONS
        value: "384"
      - key: UPLOAD_DIR
        value: /tmp/contractlens-uploads
      - key: LOG_LEVEL
        value: INFO
